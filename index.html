<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

        <!-- Primary SEO (per-tool values are written at build time by plugins/seo.ts) -->
        <title>DevTools — Free Developer Tools in Your Browser</title>
        <meta name="description" content="Free, private developer tools that run entirely in your browser: JSON formatter, regex tester, hash &amp; UUID generators, JWT decoder, cron, Base64, color tools and more. No sign-up, works offline." />
        <meta name="keywords" content="developer tools, online tools, json formatter, regex tester, uuid generator, hash generator, jwt decoder, base64" />
        <meta name="author" content="Saiful Alam Rakib" />
        <meta name="robots" content="index, follow, max-image-preview:large" />
        <link rel="canonical" href="https://tools.msar.me/" />
        <link rel="search" type="application/opensearchdescription+xml" title="DevTools" href="/opensearch.xml" />
        <link rel="alternate" type="text/plain" title="LLM-readable tool index" href="/llms.txt" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="DevTools" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:title" content="DevTools — Free Developer Tools in Your Browser" />
        <meta property="og:description" content="Free, private developer tools that run entirely in your browser." />
        <meta property="og:url" content="https://tools.msar.me/" />
        <meta property="og:image" content="https://tools.msar.me/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="DevTools: everyday developer tools, right in your browser" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="DevTools — Free Developer Tools in Your Browser" />
        <meta name="twitter:description" content="Free, private developer tools that run entirely in your browser." />
        <meta name="twitter:image" content="https://tools.msar.me/og-image.png" />

        <!-- Icons & PWA (the manifest link is injected by vite-plugin-pwa) -->
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#07080b" media="(prefers-color-scheme: dark)" />
        <meta name="color-scheme" content="light dark" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="DevTools" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="application-name" content="DevTools" />

        <script type="application/ld+json" id="ld-json">{"@context":"https://schema.org","@type":"WebSite","name":"DevTools","url":"https://tools.msar.me/"}</script>

        <script>
            try {
                var m = localStorage.getItem("devtools:theme") || "system";
                if (m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
                    document.documentElement.classList.add("dark");
            } catch (e) {}
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,100..900&family=Sora:wght@100..800&family=JetBrains+Mono:wght@100..800&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="app"><!--app-html--></div>
        <noscript>DevTools needs JavaScript enabled to run its tools in your browser.</noscript>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
