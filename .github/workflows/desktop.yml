name: Desktop app

# Builds the Tauri desktop app.
# - Pull requests touching the desktop code: build check on every OS (no release). Pushes to main do nothing.
# - Tag `desktop-v*` (e.g. desktop-v1.0.9) or manual run: build, then attach installers and the signed
#   updater manifest (latest.json) to a draft GitHub Release. Publishing that release ships the update
#   to existing installs and triggers homebrew.yml to update the cask.
#
# Required secrets for releases: TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if set).

on:
    push:
        tags: ["desktop-v*"]
    pull_request:
        paths: ["src-tauri/**", "src/desktop/**", ".github/workflows/desktop.yml"]
    workflow_dispatch:
        inputs:
            release:
                description: "Publish installers to a draft release"
                type: boolean
                default: true

permissions:
    contents: write

concurrency:
    group: desktop-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Creates (or reuses) the draft release once, before the builds, so the four build jobs only upload to it.
    # This avoids parallel jobs racing to create duplicate drafts, and fails fast if releases can't be created.
    create-release:
        name: Create draft release
        if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        runs-on: ubuntu-latest
        outputs:
            release_id: ${{ steps.release.outputs.id }}
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Create or reuse draft
              id: release
              shell: bash
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  TAG="desktop-v$VERSION"
                  if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
                      echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $VERSION (expected $TAG)."
                      exit 1
                  fi
                  # Drafts aren't returned by the get-release-by-tag API, so look through the list.
                  ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                      --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
                  if [[ -z "$ID" ]]; then
                      cat > notes.md <<'NOTES'
                  Download the installer for your platform from the assets below.

                  **Homebrew (macOS)**
                  ```
                  brew tap 4msar/tools https://github.com/4msar/tools
                  brew install --cask devtools
                  ```

                  Already installed? DevTools updates itself — or use *Check for Updates…* in the menubar.
                  NOTES
                      # Take the id from the create response: a new draft doesn't show up in the list right away.
                      ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                          -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
                          -f name="DevTools Desktop v$VERSION" -F body=@notes.md \
                          -F draft=true -F prerelease=false --jq .id)
                  fi
                  if [[ -z "$ID" ]]; then echo "::error::Couldn't create or find the release for $TAG"; exit 1; fi
                  echo "Release $TAG → id $ID"
                  echo "id=$ID" >> "$GITHUB_OUTPUT"

    build:
        name: ${{ matrix.name }}
        needs: create-release
        # Also run for build checks, where create-release is skipped.
        if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS (Apple Silicon)
                      os: macos-latest
                      target: aarch64-apple-darwin
                    - name: macOS (Intel)
                      os: macos-latest
                      target: x86_64-apple-darwin
                    - name: Windows
                      os: windows-latest
                      target: x86_64-pc-windows-msvc
                    - name: Linux
                      os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
        runs-on: ${{ matrix.os }}
        env:
            IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Linux system dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

            # Corepack must be enabled on the Node that setup-node installs, otherwise Windows falls back to the
            # runner's global Yarn 1 (packageManager is yarn@4). The Yarn cache is handled separately for the same reason.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "26"

            - name: Enable Corepack
              run: corepack enable

            - name: Locate Yarn cache
              id: yarn-cache
              shell: bash
              # `corepack yarn`: under bash on Windows a bare `yarn` is the runner's global Yarn 1.
              run: echo "dir=$(corepack yarn config get cacheFolder || true)" >> "$GITHUB_OUTPUT"

            - name: Yarn cache
              if: steps.yarn-cache.outputs.dir != ''
              uses: actions/cache@v4
              with:
                  path: ${{ steps.yarn-cache.outputs.dir }}
                  key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
                  restore-keys: yarn-${{ runner.os }}-

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: "./src-tauri -> target"
                  key: ${{ matrix.target }}

            - name: Install dependencies
              run: yarn install --immutable

            # Optional macOS code signing / notarization: only exported when the secrets exist.
            # (Tauri treats an empty APPLE_CERTIFICATE as "sign with this" and fails.)
            - name: Apple signing secrets
              if: runner.os == 'macOS'
              shell: bash
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: |
                  for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                      if [ -n "${!v}" ]; then echo "$v=${!v}" >> "$GITHUB_ENV"; fi
                  done
                  [ -n "$APPLE_CERTIFICATE" ] && echo "Signing with Apple certificate" || echo "No Apple certificate: building unsigned"

            - name: Build and release
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Signs the update bundles; the matching public key is in src-tauri/tauri.conf.json.
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  # Build checks skip the signed update bundles, so they work without the secrets (e.g. fork PRs).
                  args: --target ${{ matrix.target }} ${{ env.IS_RELEASE != 'true' && '--config src-tauri/tauri.build-check.conf.json' || '' }}
                  # Upload to the draft made by create-release; empty for build checks (nothing is uploaded).
                  releaseId: ${{ needs.create-release.outputs.release_id }}

            - name: Upload build artifacts
              if: env.IS_RELEASE != 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: devtools-${{ matrix.target }}
                  path: |
                      src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
                      src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
                      src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
                      src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
                      src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
                  if-no-files-found: ignore
                  retention-days: 7
